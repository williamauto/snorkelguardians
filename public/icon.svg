<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a4d4f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#052a2c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle/square for versatility -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Abstract wave/fin shape - minimalist -->
  <g transform="translate(256, 256)">
    <!-- Main wave form -->
    <path d="M -120 -20 Q -60 -60 0 -20 Q 60 20 120 -20 L 120 40 Q 60 0 0 40 Q -60 80 -120 40 Z" 
          fill="none" 
          stroke="#4fd1c5" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Coral/reef accent -->
    <circle cx="-40" cy="10" r="6" fill="#ff6b6b" opacity="0.9"/>
    <circle cx="20" cy="25" r="4" fill="#ff6b6b" opacity="0.7"/>
    <circle cx="60" cy="15" r="5" fill="#ff6b6b" opacity="0.8"/>
    
    <!-- Small fish/turtle silhouette -->
    <path d="M -80 5 Q -70 -5 -60 5 Q -70 15 -80 5 Z" fill="#a0f0e8" opacity="0.9"/>
    <circle cx="-62" cy="3" r="1.5" fill="#0a4d4f"/>
  </g>
  
  <!-- Text -->
  <text x="256" y="420" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="42" font-weight="700" fill="#a0f0e8" text-anchor="middle" 
        letter-spacing="0.15em">SNORKEL</text>
  <text x="256" y="465" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="42" font-weight="700" fill="#a0f0e8" text-anchor="middle" 
        letter-spacing="0.15em">GUARDIANS</text>
</svg>
